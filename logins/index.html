<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>FIB · PMO — Sign-in log</title>
<style>
  :root{--brand:#0e9f8f;--brand-d:#0c7a67;--ink:#1e2521;--muted:#7c8b85;
        --line:#e7ecea;--card:#fff;--bg1:#faf9f5;--bg2:#f0eee6;--warn:#b45309}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);
    background:radial-gradient(900px 600px at 50% -10%,#f7e9dd 0,transparent 60%),
               radial-gradient(800px 500px at 90% 110%,#efe9dc 0,transparent 60%),
               linear-gradient(160deg,#faf9f5,#f0eee6);
    padding:26px 16px 60px}
  .wrap{max-width:980px;margin:0 auto}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .mark{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;
    background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;font-weight:800;font-size:15px}
  h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em}
  .kicker{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brand-d)}
  .card{background:var(--card);border:1px solid #e7ecea;border-radius:18px;padding:18px 18px 14px;
    box-shadow:0 24px 50px -30px rgba(12,90,74,.35);margin-top:16px}
  .gate{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .gate input{flex:1;min-width:200px;border:1px solid #cfe0da;border-radius:11px;background:#f6fbf9;
    padding:11px 13px;font-size:14px;font-family:inherit;outline:none}
  .gate input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,159,143,.16)}
  .btn{border:none;border-radius:11px;padding:11px 18px;font-weight:700;font-size:14px;cursor:pointer;
    color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand-d));font-family:inherit}
  .btn:hover{filter:brightness(1.05)} .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:#eef4f2;color:var(--brand-d)}
  .msg{font-size:13px;color:var(--warn);min-height:18px;margin-top:10px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 2px 12px}
  .bar .count{font-weight:800;font-size:13px} .bar .sub{color:var(--muted);font-size:12.5px}
  .bar .spacer{margin-left:auto}
  .filter{border:1px solid #e2e8f0;border-radius:999px;background:#fff;padding:7px 12px;font-size:12.5px;font-family:inherit}
  .tablewrap{overflow-x:auto;border:1px solid #eef1ef;border-radius:14px}
  table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #f0f2f0;white-space:nowrap}
  th{background:#f6faf8;color:#4b5a54;font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;position:sticky;top:0}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#fafdfc}
  .pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px}
  .pill.report{background:#eff6ff;color:#1e40af}
  .pill.dashboard{background:#ecfdf5;color:#065f46}
  .pill.unknown{background:#f1f5f9;color:#475569}
  .nm{font-weight:700}
  .mut{color:var(--muted)}
  .foot{color:#9ca69f;font-size:11.5px;text-align:center;margin-top:18px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 2px}
  .stat{background:#fff;border:1px solid #eef1ef;border-radius:14px;padding:12px 14px}
  .stat .n{font-size:23px;font-weight:800;line-height:1}
  .stat .l{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .stat.ok .n{color:#065f46}.stat.try .n{color:#1e40af}.stat.sent .n{color:#b45309}.stat.on .n{color:#0e9f8f}
  .online{margin:2px 2px 6px;font-size:13px;color:var(--muted)}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;
    border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;margin:3px 5px 0 0}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.22)}
  .pill.ev-ok{background:#ecfdf5;color:#065f46}
  .pill.ev-send{background:#fff7ed;color:#b45309}
  .pill.ev-fail{background:#fef2f2;color:#b91c1c}
  @media(max-width:520px){ h1{font-size:17px} .stat .n{font-size:20px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="mark">FIB</div>
    <div>
      <div class="kicker">First Iraq Bank · PMO</div>
      <h1>Sign-in log</h1>
    </div>
  </div>

  <div class="card" id="gate-card">
    <div class="gate">
      <input id="key" type="password" placeholder="Admin password" autocomplete="off"
             onkeydown="if(event.key==='Enter')load()">
      <button class="btn" id="go" onclick="load()">View log</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div id="view" style="display:none">
    <div class="stats" id="stats"></div>
    <div class="online" id="online"></div>
    <div class="bar">
      <span class="count" id="count"></span>
      <span class="sub" id="range"></span>
      <span class="spacer"></span>
      <select class="filter" id="evf" onchange="render()">
        <option value="">All events</option>
        <option value="ok">Signed in</option>
        <option value="send">Code sent</option>
        <option value="fail">Wrong code</option>
      </select>
      <select class="filter" id="appf" onchange="render()">
        <option value="">All apps</option>
        <option value="report">Report only</option>
        <option value="dashboard">Dashboard only</option>
      </select>
      <button class="btn ghost" onclick="load()">Refresh</button>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>#</th><th>Event</th><th>Name</th><th>App</th><th>When (Baghdad)</th><th>Country</th><th>IP</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div class="foot">Shows the most recent sign-ins (last 500). Times in Baghdad. Authorized staff only.</div>
</div>

<script>
  var OTP_API = 'https://fibpmo-otp.rudaw-a-the-gw.workers.dev';
  var _all = [], _online = [];
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmt(t){
    try{
      var d = new Date(t*1000);
      return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Baghdad',weekday:'short',day:'2-digit',
        month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}).format(d);
    }catch(e){ return '—'; }
  }
  function flag(cc){
    if(!cc || cc.length!==2) return '';
    var A=0x1F1E6; return String.fromCodePoint(A+cc.charCodeAt(0)-65)+String.fromCodePoint(A+cc.charCodeAt(1)-65);
  }
  async function load(){
    var key = document.getElementById('key').value.trim();
    var msg = document.getElementById('msg'); var go = document.getElementById('go');
    if(!key){ msg.textContent='Enter the admin key.'; return; }
    msg.style.color=''; msg.textContent='Loading…'; go.disabled=true;
    try{
      var r = await fetch(OTP_API + '/api/logins?key=' + encodeURIComponent(key), {cache:'no-store'});
      if(r.status===401){ msg.style.color='#b45309'; msg.textContent='Wrong admin key.'; go.disabled=false; return; }
      var d = await r.json();
      _all = (d.logins||[]);
      _online = (d.online||[]);
      msg.textContent='';
      document.getElementById('view').style.display='block';
      render();
    }catch(e){ msg.style.color='#b45309'; msg.textContent='Could not reach the server. Check your connection.'; }
    finally{ go.disabled=false; }
  }
  var EV = { ok:{cls:'ev-ok',label:'Signed in'}, send:{cls:'ev-send',label:'Code sent'}, fail:{cls:'ev-fail',label:'Wrong code'} };
  function evOf(x){ return EV[x.ev] ? x.ev : 'ok'; } // older rows had no ev — they were logins
  function render(){
    var now = Math.floor(Date.now()/1000);
    // ── stats over the whole log ──────────────────────────────────────────
    var sent=0, ok=0, fail=0;
    _all.forEach(function(x){ var e=evOf(x); if(e==='send')sent++; else if(e==='fail')fail++; else ok++; });
    var attempts = ok + fail;
    // Online now = real presence from the Worker: pages that pinged within the
    // last ~90s. Closing the tab drops the person immediately (leave beacon).
    document.getElementById('stats').innerHTML =
      tile('on', _online.length, 'Online now') +
      tile('ok', ok, 'Successful sign-ins') +
      tile('try', attempts, 'Connect attempts') +
      tile('sent', sent, 'Codes sent') +
      tile('', fail, 'Wrong-code tries');
    document.getElementById('online').innerHTML = _online.length
      ? ('<b>Online now:</b> ' + _online.map(function(o){
          return '<span class="chip"><span class="dot"></span>'+esc(o.name)+
                 ' <span style="opacity:.7;font-weight:600">· '+esc(o.app)+'</span></span>'; }).join(''))
      : '<b>Online now:</b> nobody is viewing right now.';
    // ── filtered table ────────────────────────────────────────────────────
    var af = document.getElementById('appf').value;
    var ef = document.getElementById('evf').value;
    var list = _all.filter(function(x){
      return (!af || x.app===af) && (!ef || evOf(x)===ef);
    });
    var tb = document.getElementById('rows'); tb.innerHTML='';
    list.forEach(function(x,i){
      var app = (x.app==='report'||x.app==='dashboard')?x.app:'unknown';
      var e = evOf(x);
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="mut">'+(i+1)+'</td>'+
        '<td><span class="pill '+EV[e].cls+'">'+EV[e].label+'</span></td>'+
        '<td class="nm">'+esc(x.name)+'</td>'+
        '<td><span class="pill '+app+'">'+app+'</span></td>'+
        '<td>'+esc(fmt(x.t))+'</td>'+
        '<td>'+(x.cc?(flag(x.cc)+' '+esc(x.cc)):'<span class="mut">—</span>')+'</td>'+
        '<td class="mut">'+esc(x.ip||'—')+'</td>';
      tb.appendChild(tr);
    });
    document.getElementById('count').textContent = list.length + ' event' + (list.length===1?'':'s');
    var latest = _all.length ? fmt(_all[0].t) : '';
    document.getElementById('range').textContent = latest ? ('· latest ' + latest) : '';
  }
  function tile(cls, n, label){
    return '<div class="stat '+cls+'"><div class="n">'+n+'</div><div class="l">'+label+'</div></div>';
  }
</script>
</body>
</html>
